name: Preview Build & Deploy

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit_count: ${{ steps.set_commit.outputs.commit_count }}
      build_time: ${{ steps.set_commit.outputs.build_time }}
      universal_size: ${{ steps.set_commit.outputs.universal_size }}
      arm64-v8a_size: ${{ steps.set_commit.outputs.arm64-v8a_size }}
      armeabi-v7a_size: ${{ steps.set_commit.outputs.armeabi-v7a_size }}
      x86_size: ${{ steps.set_commit.outputs.x86_size }}
      x86_64_size: ${{ steps.set_commit.outputs.x86_64_size }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleStandardPreview

      - name: Sign APKs
        run: |
          set -e
          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore
          
          APK_COUNT=$(find "$PREVIEW_DIR" -name "app-standard-*-preview-unsigned.apk" -type f | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No unsigned preview APK files found"
            ls -lah "$PREVIEW_DIR"
            rm release.keystore
            exit 1
          fi
          
          find "$PREVIEW_DIR" -name "app-standard-*-preview-unsigned.apk" -type f | while read -r apk; do
            signed_apk="${apk/-unsigned/}"
          
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$apk"
          
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$signed_apk"
            rm "$apk"
          done
          
          rm release.keystore
          ls -lh "$PREVIEW_DIR"/app-standard-*-preview.apk

      - name: Copy build artifacts
        id: set_commit
        run: |
          set -e
          commit_count=$(git rev-list --count HEAD)
          build_time=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
          echo "build_time=$build_time" >> $GITHUB_OUTPUT

          declare -a apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          mkdir -p output
          # Initialize empty array for file sizes
          declare -a file_sizes=()
          
          for arch in "${apks[@]}"; do
            src="app/build/outputs/apk/standard/preview/app-standard-${arch}-preview.apk"
            dest="output/mpvEx-preview-r${commit_count}-${arch}.apk"
            cp "$src" "$dest"
          
            # Get file size in human-readable format
            size=$(du -h "$dest" | cut -f1)
            echo "${arch}_size=$size" >> $GITHUB_OUTPUT
          done

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-apks
          path: output/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: preview-apks
          path: ./public

      - name: Generate download page
        run: |
          commit_count=${{ needs.build.outputs.commit_count }}
          build_time="${{ needs.build.outputs.build_time }}"
          echo "<!DOCTYPE html>
          <html lang='en'>
          <head>
            <meta charset='UTF-8'>
            <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=5.0'>
            <title>mpvEx Preview Builds</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; line-height: 1.6; padding: 1.25rem; max-width: 800px; margin: 0 auto; }
              header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
              .brand { font-size: 1.1rem; font-weight: 700; color: #f0f6fc; text-decoration: none; }
              .nav { display: flex; gap: 1rem; flex-wrap: wrap; }
              .nav a { color: #8b949e; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
              .nav a:hover { color: #58a6ff; }
              h1 { color: #58a6ff; font-size: 1.75rem; margin-bottom: 0.35rem; }
              .build-info { color: #8b949e; font-size: 0.88rem; margin-bottom: 1.25rem; }
              ul { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; margin: 1rem 0; }
              li a { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 1rem; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #58a6ff; text-decoration: none; font-weight: 500; transition: border-color 0.15s; }
              li a:hover { border-color: #58a6ff; background: #1c2128; }
              .filesize { color: #8b949e; font-size: 0.85em; font-weight: normal; }
              .footer { color: #8b949e; font-size: 0.85rem; margin-top: 2rem; border-top: 1px solid #30363d; padding-top: 1.25rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
              .footer a { color: #58a6ff; text-decoration: none; }
              @media (max-width: 600px) {
                body { padding: 1rem; }
                h1 { font-size: 1.45rem; }
                li a { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
              }
            </style>
          </head>
          <body>
            <header>
              <a href='index.html' class='brand'>mpvExtended</a>
              <nav class='nav'>
                <a href='index.html'>Preview Builds</a>
                <a href='privacy-policy.html'>Privacy Policy</a>
                <a href='https://github.com/marlboro-advance/mpvEx'>GitHub</a>
              </nav>
            </header>
            <h1>mpvEx Preview Build r${commit_count}</h1>
            <p class='build-info'>Build time: ${build_time}</p>
            <p>Download signed test APKs:</p>
            <ul>
              <li><a href='mpvEx-preview-r${commit_count}-universal.apk'><span>Universal</span> <span class='filesize'>${{ needs.build.outputs.universal_size }}</span></a></li>
              <li><a href='mpvEx-preview-r${commit_count}-arm64-v8a.apk'><span>arm64-v8a</span> <span class='filesize'>${{ needs.build.outputs.arm64-v8a_size }}</span></a></li>
              <li><a href='mpvEx-preview-r${commit_count}-armeabi-v7a.apk'><span>armeabi-v7a</span> <span class='filesize'>${{ needs.build.outputs.armeabi-v7a_size }}</span></a></li>
              <li><a href='mpvEx-preview-r${commit_count}-x86.apk'><span>x86</span> <span class='filesize'>${{ needs.build.outputs.x86_size }}</span></a></li>
              <li><a href='mpvEx-preview-r${commit_count}-x86_64.apk'><span>x86_64</span> <span class='filesize'>${{ needs.build.outputs.x86_64_size }}</span></a></li>
            </ul>
            <div class='footer'>
              <div>Built automatically from the <code>dev</code> branch.</div>
              <div><a href='privacy-policy.html'>Privacy Policy</a> &bull; <a href='https://github.com/marlboro-advance/mpvEx'>GitHub</a></div>
            </div>
          </body>
          </html>" > ./public/index.html
          cp -r docs/* ./public/ 2>/dev/null || true

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4